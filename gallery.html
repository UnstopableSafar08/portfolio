<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Certifications - Sagar Malla</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet"
        type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        :root {
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-tertiary: #2dd4bf;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: #020617;
            background-image:
                radial-gradient(at 0% 0%, #0f172a 0, transparent 55%),
                radial-gradient(at 50% 0%, #1e1b4b 0, transparent 50%),
                radial-gradient(at 100% 0%, #2e1065 0, transparent 55%),
                radial-gradient(at 0% 50%, #0c4a6e 0, transparent 50%),
                radial-gradient(at 100% 50%, #4c1d95 0, transparent 50%),
                radial-gradient(at 0% 100%, #1e293b 0, transparent 50%),
                radial-gradient(at 50% 100%, #020617 0, transparent 50%),
                radial-gradient(at 100% 100%, #1e1b4b 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding-top: 3.375rem;
            color: var(--text-dim) !important;
            overflow-x: hidden;
        }

        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: none;
            }
        }

        @media (min-width: 992px) {
            body {
                padding-top: 0;
                padding-left: 17rem;
            }
        }

        .resume-section-content {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            transition: all 0.3s ease;
        }

        /* Custom Cursor */
        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-tertiary);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10000;
            border-radius: 50%;
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent-primary);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
        }

        #sideNav {
            background: #0f172a !important;
            border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
            z-index: 1030;
        }

        .nav-link {
            color: var(--text-dim) !important;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-main) !important;
            text-shadow: 0 0 10px var(--accent-primary);
        }

        /* Carousel Styles */
        .carousel-item img {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.2);
            margin: 0 auto;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            bottom: 5px;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            width: 3rem;
            height: 3rem;
            background-color: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            background-size: 50%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .carousel-control-prev-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23818cf8'%3e%3cpath d='M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z'/%3e%3c/svg%3e");
        }

        .carousel-control-next-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%232dd4bf'%3e%3cpath d='M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
        }

        .carousel-control-prev:hover .carousel-control-prev-icon {
            transform: scale(1.1);
            background-color: var(--accent-primary);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23020617'%3e%3cpath d='M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z'/%3e%3c/svg%3e");
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.6);
            border-color: var(--text-main);
        }

        .carousel-control-next:hover .carousel-control-next-icon {
            transform: scale(1.1);
            background-color: var(--accent-tertiary);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23020617'%3e%3cpath d='M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.6);
            border-color: var(--text-main);
        }

        .btn-theme {
            background: var(--accent-primary);
            color: #020617 !important;
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(129, 140, 248, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn-theme:hover {
            background: var(--accent-tertiary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(45, 212, 191, 0.4);
        }
    </style>
</head>

<body id="page-top">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="sideNav">
        <a class="navbar-brand js-scroll-trigger" href="index.html">
            <span class="d-block d-lg-none">Sagar Malla</span>
            <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2"
                    src="assets/img/sagarmalla.gif" alt="sagarMalla" /></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Back to Portfolio</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <section class="resume-section p-3 p-lg-5">
            <div class="resume-section-content" data-aos="fade-up">
                <h2 class="mb-3" style="font-size: 2rem;">Certifications</h2>

                <div id="certCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carousel-inner">
                        <!-- Dynamic items will be inserted here -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-info" role="status">
                                <span class="visually-hidden">Loading Gallery...</span>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#certCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#certCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>

                <div class="text-center mt-3">
                    <a href="index.html#awards" class="btn-theme">Back to Certifications</a>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();

        async function loadGallery() {
            const carouselInner = document.getElementById('carousel-inner');
            try {
                const response = await fetch('./assets/certifications/');
                if (!response.ok) throw new Error('Could not fetch directory listing');

                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const images = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && (href.toLowerCase().endsWith('.jpg') || href.toLowerCase().endsWith('.png') || href.toLowerCase().endsWith('.jpeg')));

                if (images.length === 0) {
                    carouselInner.innerHTML = '<p class="text-center">No certification images found in /assets/certifications/.</p>';
                    return;
                }

                carouselInner.innerHTML = '';

                images.forEach((href, index) => {
                    // Clean up name for display
                    let name = decodeURIComponent(href)
                        .replace(/\.[^/.]+$/, "") // remove extension
                        .replace(/[-_]/g, " ")
                        .trim();

                    // Capitalize words
                    name = name.split(' ')
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                        .join(' ');

                    const item = document.createElement('div');
                    item.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                    item.innerHTML = `
                        <img src="assets/certifications/${href}" class="d-block w-100" alt="${name}">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="text-white">${name}</h5>
                        </div>
                    `;
                    carouselInner.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading gallery:', error);
                carouselInner.innerHTML = '<div class="alert alert-warning bg-dark text-light border-0">Could not load gallery remotely. Please ensure images are present in /assets/certifications/.</div>';
            }
        }

        loadGallery();

        // Custom Cursor Logic
        const cursorDot = document.querySelector(".cursor-dot");
        const cursorOutline = document.querySelector(".cursor-outline");
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        if (isTouchDevice) {
            if (cursorDot) cursorDot.style.display = "none";
            if (cursorOutline) cursorOutline.style.display = "none";
        } else {
            window.addEventListener("mousemove", function (e) {
                const posX = e.clientX;
                const posY = e.clientY;

                cursorDot.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;

                cursorOutline.animate({
                    transform: `translate3d(${posX - 20}px, ${posY - 20}px, 0)`
                }, { duration: 400, fill: "forwards" });
            });

            const links = document.querySelectorAll("a, button");
            links.forEach(link => {
                link.addEventListener("mouseenter", () => {
                    cursorOutline.style.width = "60px";
                    cursorOutline.style.height = "60px";
                    cursorOutline.style.background = "rgba(129, 140, 248, 0.1)";
                });
                link.addEventListener("mouseleave", () => {
                    cursorOutline.style.width = "40px";
                    cursorOutline.style.height = "40px";
                    cursorOutline.style.background = "transparent";
                });
            });
        }
    </script>
</body>

</html>
